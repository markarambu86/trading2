<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECC Tools - Advanced Trading Terminal</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:'Inter',sans-serif;
    background:#020617;
    color:#e2e8f0;
    overflow-x:hidden;
}
.card { background:#081018; border:1px solid #1e293b; border-radius:24px; }
.buy { color:#22c55e; }
.sell { color:#ef4444; }
.wait { color:#94a3b8; }
.metric { background:#0f172a; border-radius:18px; padding:16px; }

.zoom-btn, .tf-btn {
    background: #1e293b;
    color: #f1f5f9;
    border: 1px solid #334155;
    padding: 6px 12px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 14px;
}
.tf-btn.active { background:#22c55e; color:black; border-color:#22c55e; }

::-webkit-scrollbar { width:7px; }
::-webkit-scrollbar-thumb { background:#1e293b; border-radius:10px; }
</style>
</head>

<body>

<header class="sticky top-0 z-50 bg-[#081018]/95 backdrop-blur border-b border-slate-800">
<div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
    <div>
        <a href="https://ecc.tools/" target="_blank" class="block group">
            <div class="text-3xl font-black bg-gradient-to-r from-cyan-400 via-emerald-400 to-indigo-500 bg-clip-text text-transparent">
                ECC.TOOLS TERMINAL
            </div>
        </a>
        <div class="text-xs text-slate-400">MULTI-FEED • FINNHUB + BINANCE</div>
    </div>

    <div class="flex items-center gap-4 flex-wrap">
        <!-- Timeframe -->
        <div class="flex items-center gap-1 bg-[#0f172a] p-1 rounded-2xl border border-slate-800" id="tfContainer"></div>

        <!-- Zoom -->
        <div class="flex items-center gap-2 bg-[#0f172a] p-1.5 rounded-2xl border border-slate-800">
            <span class="text-xs text-slate-400 px-2 font-semibold">ZOOM:</span>
            <button onclick="adjustZoom(-0.1)" class="zoom-btn">−</button>
            <button onclick="resetZoom()" id="zoomPercent" class="zoom-btn text-xs font-mono">100%</button>
            <button onclick="adjustZoom(0.1)" class="zoom-btn">+</button>
        </div>

        <div id="clock" class="font-mono bg-slate-900/50 px-3 py-1.5 rounded-xl border border-slate-800 text-sm"></div>
    </div>
</div>
</header>

<div class="max-w-7xl mx-auto p-4 space-y-4">
    <!-- TOP CARD -->
    <div class="card p-5">
        <div class="flex flex-wrap justify-between items-center gap-5">
            <div>
                <div id="pairText" class="text-4xl font-black tracking-tight">XAUUSD</div>
                <div id="priceText" class="text-5xl font-black buy tracking-tight">0.00</div>
                <div id="statusText" class="text-slate-400 mt-2 text-sm font-medium">Connecting to institutional feed...</div>
            </div>
            <div id="pairButtons" class="flex gap-3 flex-wrap"></div>
        </div>
    </div>

    <!-- CHART -->
    <div class="card p-4">
        <div id="chart" class="w-full h-[460px]"></div>
    </div>

    <!-- SIGNAL & ANALYTICS -->
    <div class="grid md:grid-cols-2 gap-4">
        <div class="card p-5">
            <div class="flex justify-between items-center mb-5">
                <div class="text-2xl font-black tracking-tight">AI QUANT SIGNAL</div>
                <div id="signalBadge" class="px-4 py-1 rounded-full bg-slate-700 text-xs font-bold">WAIT</div>
            </div>
            <div id="signalText" class="text-6xl font-black wait mb-3 tracking-tighter">WAIT</div>
            <div id="reasonText" class="text-slate-300 text-sm">Analyzing market structure...</div>

            <div class="grid grid-cols-2 gap-4 mt-6">
                <div class="metric">
                    <div class="text-xs text-slate-400">STOP LOSS</div>
                    <div id="slText" class="text-xl font-black text-red-400">0</div>
                </div>
                <div class="metric">
                    <div class="text-xs text-slate-400">TAKE PROFIT</div>
                    <div id="tpText" class="text-xl font-black text-emerald-400">0</div>
                </div>
            </div>
        </div>

        <div class="card p-5">
            <div class="text-2xl font-black mb-5">ECC MARKET ALGORITHMS</div>
            <div class="grid grid-cols-2 gap-4">
                <div class="metric"><div class="text-xs text-slate-400">RSI (14)</div><div id="rsiText" class="text-2xl font-black text-cyan-400">0</div></div>
                <div class="metric"><div class="text-xs text-slate-400">TREND</div><div id="trendText" class="text-2xl font-black text-emerald-400">SIDEWAYS</div></div>
                <div class="metric"><div class="text-xs text-slate-400">VWAP</div><div id="vwapText" class="text-2xl font-black text-yellow-400">0</div></div>
                <div class="metric"><div class="text-xs text-slate-400">ACCURACY</div><div id="scoreText" class="text-2xl font-black text-pink-400">0%</div></div>
            </div>
        </div>
    </div>
</div>

<script>
// ==================== CONFIG ====================
const FINNHUB_API_KEY = 'd8aamj1r01ql25r6pkv0d8aamj1r01ql25r6pkvg';

const assets = {
    XAUUSD: { type: 'finnhub', symbol: 'OANDA:XAU_USD', display: '🥇 XAU/USD' },
    XAGUSD: { type: 'finnhub', symbol: 'OANDA:XAG_USD', display: '🥈 XAG/USD' },
    EURUSD: { type: 'finnhub', symbol: 'OANDA:EUR_USD', display: '💶 EUR/USD' },
    GBPUSD: { type: 'finnhub', symbol: 'OANDA:GBP_USD', display: '💷 GBP/USD' },
    USDJPY: { type: 'finnhub', symbol: 'OANDA:USD_JPY', display: '💴 USD/JPY' },
    AUDUSD: { type: 'finnhub', symbol: 'OANDA:AUD_USD', display: '🇦🇺 AUD/USD' },
    BTCUSDT: { type: 'binance', symbol: 'btcusdt', display: '🟠 BTC' },
    ETHUSDT: { type: 'binance', symbol: 'ethusdt', display: '🔷 ETH' },
    SOLUSDT: { type: 'binance', symbol: 'solusdt', display: '🟣 SOL' },
    NAS100: { type: 'finnhub', symbol: 'OANDA:NAS100_USD', display: '📈 NAS100' },
    SPX500: { type: 'finnhub', symbol: 'OANDA:SPX500_USD', display: '📊 SPX500' },
    US30:   { type: 'finnhub', symbol: 'OANDA:US30_USD', display: '🏛️ US30' }
};

const timeframes = [
    {value:'1', label:'1m'}, {value:'5', label:'5m'},
    {value:'15', label:'15m'}, {value:'30', label:'30m'}, {value:'60', label:'1H'}
];

// ==================== STATE ====================
const state = {
    pair: 'XAUUSD',
    timeframe: '1',
    ws: null,
    candles: [],
    currentCandle: null,
    lastPrice: 0,
    vwapPV: 0,
    vwapVolume: 0,
    currentZoom: 1.0,
    lastSignal: 'WAIT'
};

// ==================== CHART SETUP ====================
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color: '#081018' }, textColor: '#cbd5e1' },
    grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
    rightPriceScale: { borderColor: '#334155' },
    timeScale: { borderColor: '#334155', timeVisible: true }
});

const candleSeries = chart.addCandlestickSeries({ upColor:'#22c55e', downColor:'#ef4444', wickUpColor:'#22c55e', wickDownColor:'#ef4444' });
const emaSeries = chart.addLineSeries({ color: '#38bdf8', lineWidth: 2 });
const macdFast = chart.addLineSeries({ color: '#a78bfa', lineWidth: 1.5 });
const macdSlow = chart.addLineSeries({ color: '#f472b6', lineWidth: 1.5 });

// ==================== HELPER FUNCTIONS ====================
function playAlert() {
    const audio = new Audio('https://freesound.org/data/previews/66/66930_931655-lq.mp3');
    audio.volume = 0.3;
    audio.play().catch(()=>{});
}

// EMA, RSI (Wilder), MACD
function calculateEMA(data, period) {
    if (data.length < period) return data[data.length-1] || 0;
    let ema = data.slice(0, period).reduce((a,b)=>a+b)/period;
    const k = 2 / (period + 1);
    for (let i = period; i < data.length; i++) {
        ema = data[i] * k + ema * (1 - k);
    }
    return ema;
}

function calculateRSI(candles) {
    if (candles.length < 15) return 50;
    let gains = 0, losses = 0;
    for (let i = candles.length - 14; i < candles.length; i++) {
        const diff = candles[i].close - candles[i-1].close;
        if (diff > 0) gains += diff;
        else losses += Math.abs(diff);
    }
    const avgGain = gains / 14;
    const avgLoss = losses / 14 || 0.0001;
    return 100 - (100 / (1 + (avgGain / avgLoss)));
}

function calculateMACD(closes) {
    const ema12 = calculateEMA(closes, 12);
    const ema26 = calculateEMA(closes, 26);
    return { macd: ema12 - ema26, signal: calculateEMA([ema12 - ema26], 9) };
}

// ==================== WEBSOCKET & FETCH (disesuaikan) ====================
async function fetchHistory() {
    const asset = assets[state.pair];
    document.getElementById('statusText').innerHTML = `Loading ${state.pair} ${state.timeframe}m...`;

    if (asset.type === 'binance') {
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${asset.symbol.toUpperCase()}&interval=${state.timeframe}m&limit=100`);
        const data = await res.json();
        state.candles = data.map(d => ({
            time: Math.floor(d[0]/1000),
            open: +d[1], high: +d[2], low: +d[3], close: +d[4]
        }));
    } else {
        // Finnhub historical terbatas, gunakan dummy candle dulu
        state.candles = [];
    }
    candleSeries.setData(state.candles);
}

function connectWS() {
    if (state.ws) state.ws.close();
    const asset = assets[state.pair];

    if (asset.type === 'binance') {
        state.ws = new WebSocket(`wss://stream.binance.com:9443/ws/${asset.symbol}@trade`);
    } else {
        state.ws = new WebSocket(`wss://ws.finnhub.io?token=${FINNHUB_API_KEY}`);
        state.ws.onopen = () => {
            state.ws.send(JSON.stringify({ type: 'subscribe', symbol: asset.symbol }));
        };
    }

    state.ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        let price, volume = 1;

        if (asset.type === 'binance') {
            price = parseFloat(msg.p);
            volume = parseFloat(msg.q);
        } else if (msg.type === 'trade') {
            const t = msg.data[0];
            price = parseFloat(t.p);
            volume = parseFloat(t.v || 1);
        }

        if (price) {
            updatePrice(price);
            buildCandle(price, volume);
        }
    };

    state.ws.onclose = () => setTimeout(connectWS, 4000);
}

// ==================== CORE LOGIC ====================
function updatePrice(price) {
    const el = document.getElementById('priceText');
    el.className = price > state.lastPrice ? 'text-5xl font-black buy tracking-tight' : 'text-5xl font-black sell tracking-tight';
    el.innerHTML = price.toFixed(asset.type === 'finnhub' && state.pair.includes('USD') ? 3 : 2);
    state.lastPrice = price;
}

function buildCandle(price, volume) {
    const time = Math.floor(Date.now() / (state.timeframe * 60000)) * (state.timeframe * 60);

    if (!state.currentCandle || state.currentCandle.time !== time) {
        if (state.currentCandle) state.candles.push(state.currentCandle);
        state.currentCandle = { time, open: price, high: price, low: price, close: price };
    } else {
        state.currentCandle.high = Math.max(state.currentCandle.high, price);
        state.currentCandle.low = Math.min(state.currentCandle.low, price);
        state.currentCandle.close = price;
    }

    state.vwapPV += price * volume;
    state.vwapVolume += volume;

    updateChart();
    generateSignal();
}

function updateChart() {
    if (!state.currentCandle) return;
    candleSeries.update(state.currentCandle);

    const closes = state.candles.map(c => c.close).concat(state.currentCandle.close);
    emaSeries.update({ time: state.currentCandle.time, value: calculateEMA(closes, 20) });

    const macd = calculateMACD(closes);
    macdFast.update({ time: state.currentCandle.time, value: macd.macd });
}

// Signal Generation + Alert
function generateSignal() {
    if (state.candles.length < 30) return;
    const closes = state.candles.map(c => c.close);
    const current = state.currentCandle.close;
    const ema20 = calculateEMA(closes, 20);
    const rsi = calculateRSI(state.candles);
    const vwap = state.vwapPV / (state.vwapVolume || 1);

    let signal = 'WAIT', reason = 'Neutral';

    if (current > ema20 && rsi > 55) {
        signal = 'BUY'; reason = 'Strong Bullish Momentum';
    } else if (current < ema20 && rsi < 45) {
        signal = 'SELL'; reason = 'Strong Bearish Pressure';
    }

    if (signal !== state.lastSignal && signal !== 'WAIT') {
        playAlert();
    }
    state.lastSignal = signal;

    updateUI(signal, rsi, vwap, current, reason);
}

function updateUI(signal, rsi, vwap, current, reason) {
    // Update all UI elements (signal, trend, sl, tp, etc.)
    document.getElementById('signalText').innerHTML = signal;
    document.getElementById('signalBadge').innerHTML = signal;
    document.getElementById('reasonText').innerHTML = reason;
    document.getElementById('rsiText').innerHTML = rsi.toFixed(1);
    document.getElementById('vwapText').innerHTML = vwap.toFixed(2);
    document.getElementById('slText').innerHTML = (current * 0.995).toFixed(2);
    document.getElementById('tpText').innerHTML = (current * 1.012).toFixed(2);

    const trendEl = document.getElementById('trendText');
    trendEl.innerHTML = signal === 'BUY' ? 'BULLISH' : signal === 'SELL' ? 'BEARISH' : 'SIDEWAYS';
    trendEl.className = signal === 'BUY' ? 'text-2xl font-black text-emerald-400' : signal === 'SELL' ? 'text-2xl font-black text-red-400' : 'text-2xl font-black text-slate-400';
}

// ==================== UI CONTROLS ====================
function createPairButtons() {
    const container = document.getElementById('pairButtons');
    container.innerHTML = '';
    Object.keys(assets).forEach(key => {
        const asset = assets[key];
        const btn = document.createElement('button');
        btn.className = `px-5 py-2.5 rounded-xl font-bold ${state.pair === key ? 'bg-gradient-to-r from-cyan-500 to-emerald-500 text-white' : 'bg-slate-800 hover:bg-slate-700'}`;
        btn.innerHTML = asset.display;
        btn.onclick = () => { state.pair = key; initTerminal(); };
        container.appendChild(btn);
    });
}

function createTimeframeButtons() {
    const container = document.getElementById('tfContainer');
    container.innerHTML = '<span class="text-xs text-slate-400 px-3">TF:</span>';
    timeframes.forEach(tf => {
        const btn = document.createElement('button');
        btn.className = `tf-btn px-3 py-1 text-sm ${state.timeframe === tf.value ? 'active' : ''}`;
        btn.innerHTML = tf.label;
        btn.onclick = () => {
            state.timeframe = tf.value;
            createTimeframeButtons();
            initTerminal();
        };
        container.appendChild(btn);
    });
}

function adjustZoom(delta) {
    state.currentZoom = Math.max(0.7, Math.min(1.5, state.currentZoom + delta));
    document.getElementById('zoomPercent').innerHTML = Math.round(state.currentZoom * 100) + '%';
    chart.resize(document.getElementById('chart').clientWidth, 460);
}

function resetZoom() {
    state.currentZoom = 1;
    document.getElementById('zoomPercent').innerHTML = '100%';
    chart.resize(document.getElementById('chart').clientWidth, 460);
}

// ==================== INIT ====================
async function initTerminal() {
    if (state.ws) state.ws.close();
    state.candles = [];
    state.vwapPV = state.vwapVolume = 0;

    await fetchHistory();
    connectWS();
    if (state.candles.length > 0) {
        state.currentCandle = state.candles[state.candles.length-1];
        generateSignal();
    }
}

// Start Application
createPairButtons();
createTimeframeButtons();
initTerminal();
setInterval(() => document.getElementById('clock').innerHTML = new Date().toLocaleTimeString('id-ID'), 1000);
</script>
</body>
</html>
