<script>
// ====================== CONFIG & STATE ======================
const FINNHUB_API_KEY = "d8a87fhr01qn98479vd0d8a87fhr01qn98479vdg"; // Ganti dengan proxy di production!

let state = {
    pair: 'BTCUSDT',
    tv: 'BINANCE:BTCUSDT',
    ws: null,
    lastPrice: 0,
    prices: [],
    volumes: [],
    signals: [],
    lastSignalTime: 0
};

const pairs = [
    { name: 'BTC', symbol: 'BINANCE:BTCUSDT' },
    { name: 'ETH', symbol: 'BINANCE:ETHUSDT' },
    { name: 'XAU', symbol: 'OANDA:XAU_USD' }
];

// ====================== UTILITIES ======================
function clock() {
    setInterval(() => {
        document.getElementById('clock').innerHTML = new Date().toLocaleTimeString('id-ID');
    }, 1000);
}

function addSignalToHistory(signal, confidence, price) {
    state.signals.unshift({
        time: new Date().toLocaleTimeString('id-ID'),
        signal,
        confidence,
        price: price.toLocaleString()
    });
    if (state.signals.length > 8) state.signals.pop();

    const container = document.getElementById('signalHistory');
    container.innerHTML = state.signals.map(s => `
        <div class="flex justify-between items-center p-3 rounded-2xl ${s.signal==='BUY'?'bg-emerald-900/30':'bg-red-900/30'}">
            <div>
                <span class="font-bold ${s.signal==='BUY'?'text-emerald-400':'text-red-400'}">${s.signal}</span>
                <span class="text-xs text-slate-400 ml-2">${s.time}</span>
            </div>
            <div class="text-right">
                <div class="text-xs text-slate-400">${s.confidence}%</div>
                <div class="text-sm">${s.price}</div>
            </div>
        </div>
    `).join('');
}

// ====================== INDICATORS ======================
function calculateEMA(period, prices) {
    if (prices.length < period) return prices[prices.length-1] || 0;
    let ema = prices[0];
    const k = 2 / (period + 1);
    for (let i = 1; i < prices.length; i++) {
        ema = prices[i] * k + ema * (1 - k);
    }
    return ema;
}

function calculateRSI(prices, period = 14) {
    if (prices.length < period + 1) return 50;
    let gains = 0, losses = 0;
    for (let i = prices.length - period; i < prices.length; i++) {
        const diff = prices[i] - prices[i-1];
        if (diff >= 0) gains += diff;
        else losses += Math.abs(diff);
    }
    const rs = gains / (losses || 1);
    return Math.min(100, Math.max(0, 100 - (100 / (1 + rs))));
}

function calculateMACD(prices) {
    const ema12 = calculateEMA(12, prices);
    const ema26 = calculateEMA(26, prices);
    return ema12 - ema26;
}

function calculateBollinger(prices, period = 20) {
    if (prices.length < period) return { upper: 0, lower: 0, middle: 0 };
    const sma = prices.slice(-period).reduce((a,b)=>a+b,0)/period;
    let variance = 0;
    for (let p of prices.slice(-period)) variance += Math.pow(p - sma, 2);
    const stdDev = Math.sqrt(variance / period);
    return {
        upper: sma + stdDev * 2,
        lower: sma - stdDev * 2,
        middle: sma
    };
}

// ====================== AI SIGNAL ENGINE (UPGRADED) ======================
function generateSignal() {
    if (state.prices.length < 50) return;
    if (Date.now() - state.lastSignalTime < 4000) return;

    state.lastSignalTime = Date.now();

    const current = state.prices[state.prices.length-1];
    const ema20 = calculateEMA(20, state.prices);
    const ema50 = calculateEMA(50, state.prices);
    const rsi = calculateRSI(state.prices);
    const macd = calculateMACD(state.prices);
    const bb = calculateBollinger(state.prices);

    let buyScore = 0, sellScore = 0;

    // Trend
    if (ema20 > ema50) buyScore += 35;
    else sellScore += 35;

    // Momentum
    if (rsi > 55 && rsi < 75) buyScore += 25;
    if (rsi < 45 && rsi > 25) sellScore += 25;

    // MACD
    if (macd > 0) buyScore += 20;
    else sellScore += 20;

    // Bollinger
    if (current < bb.lower) buyScore += 15;
    if (current > bb.upper) sellScore += 15;

    // Volume (simulasi)
    if (state.volumes.length > 0) {
        const avgVol = state.volumes.reduce((a,b)=>a+b,0)/state.volumes.length;
        if (state.volumes[state.volumes.length-1] > avgVol * 1.8) buyScore += 15;
    }

    let signal = 'WAIT';
    let reason = 'Pasar sedang sideways';
    let confidence = Math.max(buyScore, sellScore);

    if (buyScore >= 75) {
        signal = 'BUY';
        reason = 'Strong bullish confluence (EMA + MACD + Volume)';
    } else if (sellScore >= 75) {
        signal = 'SELL';
        reason = 'Bearish pressure with momentum confirmation';
    }

    updateUI(signal, reason, confidence, rsi, current, ema20, ema50);
    addSignalToHistory(signal, confidence, current);
}

// ====================== UI UPDATE ======================
function updateUI(signal, reason, confidence, rsi, current, ema20, ema50) {
    const signalBox = document.getElementById('signalBox');

    if (signal === 'BUY') {
        signalBox.className = 'buy-bg rounded-3xl p-8 text-center';
        document.getElementById('trendText').innerHTML = 'BULLISH';
    } else if (signal === 'SELL') {
        signalBox.className = 'sell-bg rounded-3xl p-8 text-center';
        document.getElementById('trendText').innerHTML = 'BEARISH';
    } else {
        signalBox.className = 'wait-bg rounded-3xl p-8 text-center';
        document.getElementById('trendText').innerHTML = 'SIDEWAYS';
    }

    document.getElementById('signalText').innerHTML = signal;
    document.getElementById('signalReason').innerHTML = reason;
    document.getElementById('confidenceText').innerHTML = confidence + '%';
    document.getElementById('rsiText').innerHTML = rsi.toFixed(0);

    // SL & TP
    const atr = Math.abs(current - calculateEMA(14, state.prices));
    if (signal === 'BUY') {
        document.getElementById('tpText').innerHTML = (current + atr * 2.5).toFixed(2);
        document.getElementById('slText').innerHTML = (current - atr * 1.1).toFixed(2);
    } else if (signal === 'SELL') {
        document.getElementById('tpText').innerHTML = (current - atr * 2.5).toFixed(2);
        document.getElementById('slText').innerHTML = (current + atr * 1.1).toFixed(2);
    }
}

// ====================== WEBSOCKET & PRICE UPDATE ======================
function updatePrice(price) {
    const el = document.getElementById('livePrice');
    el.className = price > state.lastPrice ? 'text-6xl font-black price-up' : 'text-6xl font-black price-down';
    el.innerHTML = parseFloat(price).toLocaleString('id-ID');

    state.lastPrice = price;
    state.prices.push(price);
    state.volumes.push(Math.random() * 1000 + 500);

    if (state.prices.length > 300) {
        state.prices.shift();
        state.volumes.shift();
    }

    generateSignal();
}

</script>
