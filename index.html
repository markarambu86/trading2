<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECC Institutional AI Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #020617; color: #e2e8f0; }
        .card { background: #081018; border: 1px solid #1e293b; border-radius: 24px; }
        .metric { background: #0f172a; border-radius: 18px; padding: 20px; }
        .live-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body class="min-h-screen pb-12">

<header class="sticky top-0 z-50 bg-[#081018]/95 backdrop-blur-lg border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <div class="text-5xl font-black bg-gradient-to-r from-cyan-400 via-emerald-400 to-violet-500 bg-clip-text text-transparent">ECC</div>
            <div>
                <div class="text-2xl font-bold tracking-tighter">INSTITUTIONAL AI TERMINAL</div>
                <div class="flex items-center gap-2 text-xs text-emerald-400">
                    <span class="w-2 h-2 bg-emerald-400 rounded-full live-dot"></span>
                    LIVE WEBSOCKET + REAL-TIME CANDLE
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <select id="symbolSelect" onchange="switchPair(this.value)" 
                    class="bg-slate-900 border border-slate-700 rounded-2xl px-6 py-3 text-base font-medium">
                <option value="XAUUSDT">XAUUSDT - Gold</option>
                <option value="BTCUSDT">BTCUSDT - Bitcoin</option>
                <option value="ETHUSDT">ETHUSDT - Ethereum</option>
            </select>
            <button onclick="openTradingView()" 
                    class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-5 py-3 rounded-2xl text-sm font-medium">
                📊 Open Full TradingView
            </button>
        </div>
    </div>
</header>

<div class="max-w-7xl mx-auto px-6 pt-8 space-y-8">

    <!-- Price Header -->
    <div class="card p-8 flex flex-col md:flex-row justify-between items-center gap-6">
        <div>
            <div id="pairDisplay" class="text-6xl font-black">XAUUSDT</div>
            <div id="priceDisplay" class="text-8xl font-black tabular-nums">0.00</div>
            <div id="changeDisplay" class="text-2xl font-medium"></div>
        </div>
        <div id="mainSignal" class="text-7xl font-black px-12 py-6 rounded-3xl text-center min-w-[280px]"></div>
    </div>

    <!-- Main Chart -->
    <div class="card p-6">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold text-xl">ECC Live Chart <span class="text-emerald-400 text-sm">(1 Minute)</span></h3>
            <div class="text-sm text-emerald-400">AI Confidence: <span id="confidence" class="font-bold">—</span>%</div>
        </div>
        <div id="chart" class="w-full h-[620px] bg-[#0a1420] rounded-2xl"></div>
    </div>

    <!-- Indicators -->
    <div class="grid md:grid-cols-2 gap-6">
        <div class="card p-8">
            <h3 class="text-2xl font-bold mb-6">ECC AI QUANT SIGNAL</h3>
            <div id="signalReason" class="text-slate-400 text-lg mb-6"></div>
            
            <div class="grid grid-cols-2 gap-6">
                <div class="metric">
                    <div class="text-xs text-slate-400">STOP LOSS</div>
                    <div id="slDisplay" class="text-4xl font-bold text-red-400">—</div>
                </div>
                <div class="metric">
                    <div class="text-xs text-slate-400">TAKE PROFIT</div>
                    <div id="tpDisplay" class="text-4xl font-bold text-emerald-400">—</div>
                </div>
            </div>
        </div>

        <div class="card p-8">
            <h3 class="text-2xl font-bold mb-6">MARKET INTELLIGENCE</h3>
            <div class="grid grid-cols-2 gap-6">
                <div class="metric">
                    <div class="text-xs text-slate-400">RSI (14)</div>
                    <div id="rsiDisplay" class="text-5xl font-bold">—</div>
                </div>
                <div class="metric">
                    <div class="text-xs text-slate-400">TREND</div>
                    <div id="trendDisplay" class="text-4xl font-bold text-emerald-400">—</div>
                </div>
                <div class="metric">
                    <div class="text-xs text-slate-400">FUNDING RATE</div>
                    <div id="fundingDisplay" class="text-4xl font-bold text-amber-400">—</div>
                </div>
                <div class="metric">
                    <div class="text-xs text-slate-400">AI SCORE</div>
                    <div id="aiScore" class="text-5xl font-bold text-violet-400">—</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Variabel global
let chart, candleSeries;
let ws = null;
let currentPair = "XAUUSDT";
let lastPrice = 0;
let currentCandle = null;

const assets = {
    "XAUUSDT": { name: "XAUUSDT", basePrice: 2658 },
    "BTCUSDT": { name: "BTCUSDT", basePrice: 68250 },
    "ETHUSDT": { name: "ETHUSDT", basePrice: 3480 }
};

// Inisialisasi Chart
function initChart() {
    const container = document.getElementById('chart');
    chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: 620,
        layout: { background: { color: '#0a1420' }, textColor: '#cbd5e1' },
        grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
        timeScale: { timeVisible: true, secondsVisible: false }
    });

    candleSeries = chart.addCandlestickSeries({
        upColor: '#22c55e',
        downColor: '#ef4444',
        borderUpColor: '#22c55e',
        borderDownColor: '#ef4444'
    });
}

// Connect WebSocket untuk Price + Kline (Candlestick)
function connectWebSocket(pair) {
    if (ws) ws.close();

    const klineStream = `${pair.toLowerCase()}@kline_1m`;   // 1 menit candle
    ws = new WebSocket(`wss://fstream.binance.com/ws/${klineStream}`);

    ws.onopen = () => console.log(`✅ Real-time Candle WebSocket Connected: ${pair}`);

    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const kline = data.k;

        const candle = {
            time: Math.floor(kline.t / 1000),   // timestamp detik
            open: parseFloat(kline.o),
            high: parseFloat(kline.h),
            low: parseFloat(kline.l),
            close: parseFloat(kline.c)
        };

        updateLiveCandle(candle);
        updatePrice(parseFloat(kline.c));
    };

    ws.onerror = (e) => console.error("WebSocket Error", e);
    ws.onclose = () => console.log("WebSocket Closed - Reconnecting...");
}

// Update atau buat candle baru di chart
function updateLiveCandle(candle) {
    if (!candleSeries) return;

    if (!currentCandle || currentCandle.time !== candle.time) {
        // Candle baru
        candleSeries.update(candle);
        currentCandle = candle;
    } else {
        // Update candle yang sedang berjalan
        candleSeries.update(candle);
        currentCandle = candle;
    }
}

// Update harga besar + signal
function updatePrice(price) {
    const change = lastPrice ? ((price - lastPrice) / lastPrice * 100) : 0;
    
    document.getElementById('priceDisplay').textContent = price.toLocaleString('id-ID', {minimumFractionDigits: 2});
    document.getElementById('changeDisplay').innerHTML = change >= 0 
        ? `<span class="text-emerald-400">▲ +${change.toFixed(3)}%</span>` 
        : `<span class="text-red-400">▼ ${change.toFixed(3)}%</span>`;

    lastPrice = price;

    const rsi = 42 + Math.random() * 32; // simulasi RSI (bisa di-upgrade nanti)
    const sig = generateSignal(price, rsi);
    
    const signalEl = document.getElementById('mainSignal');
    signalEl.textContent = sig.signal;
    signalEl.style.backgroundColor = sig.signal.includes("BUY") ? "#052e16" : "#450a0a";
    signalEl.style.color = sig.signal.includes("BUY") ? "#4ade80" : "#f87171";

    document.getElementById('signalReason').textContent = sig.reason;
    document.getElementById('confidence').textContent = sig.confidence;
    document.getElementById('rsiDisplay').textContent = rsi.toFixed(1);
}

function generateSignal(price, rsi) {
    if (rsi < 35) return { signal: "STRONG BUY", confidence: 88, reason: "Oversold + Strong Momentum" };
    if (rsi > 65) return { signal: "STRONG SELL", confidence: 85, reason: "Overbought Condition" };
    if (rsi < 45) return { signal: "BUY", confidence: 74, reason: "Good Entry Point" };
    return { signal: "NEUTRAL", confidence: 57, reason: "Waiting for clearer signal" };
}

function openTradingView() {
    window.open(`https://www.tradingview.com/chart/?symbol=BINANCE:${currentPair}`, '_blank');
}

function switchPair(pair) {
    currentPair = pair;
    document.getElementById('pairDisplay').textContent = assets[pair].name;
    lastPrice = 0;
    currentCandle = null;
    connectWebSocket(pair);
}

// Initialize
window.onload = function() {
    initChart();
    connectWebSocket(currentPair);
    
    window.addEventListener('resize', () => {
        if (chart) chart.resize(document.getElementById('chart').clientWidth, 620);
    });
};
</script>
</body>
</html>
