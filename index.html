<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ECC Lite Trading Terminal - Multi-Asset</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#020617;
color:#e2e8f0;
overflow-x:hidden;
/* Transisi mulus saat web diperbesar/diperkecil */
transition: transform 0.2s ease, transform-origin 0.2s ease; 
transform-origin: top center;
}

.card{
background:#081018;
border:1px solid #1e293b;
border-radius:24px;
}

.buy{
color:#22c55e;
}

.sell{
color:#ef4444;
}

.wait{
color:#94a3b8;
}

.metric{
background:#0f172a;
border-radius:18px;
padding:16px;
}

button{
transition:.2s;
}

button:hover{
transform:translateY(-2px);
}

/* Style khusus tombol zoom */
.zoom-btn {
background: #1e293b;
color: #f1f5f9;
border: 1px solid #334155;
padding: 6px 12px;
border-radius: 10px;
font-weight: bold;
font-size: 14px;
}
.zoom-btn:hover {
background: #334155;
}

::-webkit-scrollbar{
width:7px;
}

::-webkit-scrollbar-thumb{
background:#1e293b;
border-radius:10px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="sticky top-0 z-50 bg-[#081018]/95 backdrop-blur border-b border-slate-800">
<div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
<div>
<div class="text-3xl font-black bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
ECC LITE TERMINAL
</div>
<div class="text-xs text-slate-400">
REALTIME • MULTI-ASSET • SMART MONEY • ZOOMABLE
</div>
</div>

<div class="flex items-center gap-4 flex-wrap">
<!-- CONTROLLER ZOOM (Perbesar / Perkecil Web) -->
<div class="flex items-center gap-2 bg-[#0f172a] p-1.5 rounded-2xl border border-slate-800">
<span class="text-xs text-slate-400 px-2 font-semibold">TAMPILAN:</span>
<button onclick="adjustZoom(-0.1)" class="zoom-btn">A-</button>
<button onclick="resetZoom()" id="zoomPercent" class="zoom-btn text-xs font-mono">100%</button>
<button onclick="adjustZoom(0.1)" class="zoom-btn">A+</button>
</div>

<div id="clock" class="font-mono bg-slate-900/50 px-3 py-1.5 rounded-xl border border-slate-800 text-sm"></div>
<div class="px-3 py-1.5 rounded-xl bg-emerald-500/20 text-emerald-400 text-xs font-bold border border-emerald-500/30">
LIVE
</div>
</div>
</div>
</header>

<!-- CONTENT -->
<div class="max-w-7xl mx-auto p-4 space-y-4">

<!-- TOP -->
<div class="card p-5">
<div class="flex flex-wrap justify-between items-center gap-5">
<div>
<div id="pairText" class="text-4xl font-black">XAUUSD</div>
<div id="priceText" class="text-5xl font-black buy">0.00</div>
<div id="statusText" class="text-slate-400 mt-2">Waiting market...</div>
</div>
<div id="pairButtons" class="flex gap-3 flex-wrap"></div>
</div>
</div>

<!-- CHART -->
<div class="card p-4">
<div id="chart" class="w-full h-[450px]"></div>
</div>

<!-- SIGNAL & ANALYTICS -->
<div class="grid md:grid-cols-2 gap-4">

<!-- SIGNAL -->
<div class="card p-5">
<div class="flex justify-between items-center mb-5">
<div class="text-2xl font-black">AI SIGNAL</div>
<div id="signalBadge" class="px-3 py-1 rounded-full bg-slate-700 text-xs font-bold">WAIT</div>
</div>

<div id="signalText" class="text-6xl font-black wait mb-3">WAIT</div>
<div id="reasonText" class="text-slate-300">No confirmation</div>

<div class="grid grid-cols-2 gap-4 mt-5">
<div class="metric">
<div class="text-xs text-slate-400 mb-1">STOP LOSS</div>
<div id="slText" class="text-xl font-black text-red-400">0</div>
</div>
<div class="metric">
<div class="text-xs text-slate-400 mb-1">TAKE PROFIT</div>
<div id="tpText" class="text-xl font-black text-emerald-400">0</div>
</div>
</div>
</div>

<!-- ANALYTICS -->
<div class="card p-5">
<div class="text-2xl font-black mb-5">MARKET DATA</div>
<div class="grid grid-cols-2 gap-4">
<div class="metric">
<div class="text-xs text-slate-400 mb-1">RSI (14)</div>
<div id="rsiText" class="text-2xl font-black text-cyan-400">0</div>
</div>
<div class="metric">
<div class="text-xs text-slate-400 mb-1">TREND</div>
<div id="trendText" class="text-2xl font-black text-emerald-400">SIDEWAYS</div>
</div>
<div class="metric">
<div class="text-xs text-slate-400 mb-1">VWAP</div>
<div id="vwapText" class="text-2xl font-black text-yellow-400">0</div>
</div>
<div class="metric">
<div class="text-xs text-slate-400 mb-1">AI SCORE</div>
<div id="scoreText" class="text-2xl font-black text-pink-400">0%</div>
</div>
</div>
</div>

</div>
</div>

<script>
// ======================================
// CONFIG & PAIRS
// ======================================
// Menggunakan XAUTUSDT (Tether Gold Futures) untuk mensimulasikan XAUUSD 24/7 secara akurat
const assetMapping = {
    'XAUUSD': { symbol: 'xautusdt', type: 'futures', displayName: 'XAU/USD (Gold)' },
    'ETHUSDT': { symbol: 'ethusdt', type: 'spot', displayName: 'ETH/USDT (Ethereum)' }
};

// ======================================
// STATE
// ======================================
const state = {
    pair: 'XAUUSD',
    ws: null,
    prices: [],
    candles: [],
    currentCandle: null,
    lastPrice: 0,
    vwapPV: 0,
    vwapVolume: 0,
    currentZoom: 1.0 // Default zoom web
};

// ======================================
// ZOOM CONTROLLER (Fungsi Perbesar / Perkecil)
// ======================================
function adjustZoom(amount) {
    state.currentZoom = Math.min(1.5, Math.max(0.7, state.currentZoom + amount));
    applyZoom();
}

function resetZoom() {
    state.currentZoom = 1.0;
    applyZoom();
}

function applyZoom() {
    document.body.style.transform = `scale(${state.currentZoom})`;
    document.body.style.width = `${100 / state.currentZoom}%`;
    document.getElementById('zoomPercent').innerHTML = `${Math.round(state.currentZoom * 100)}%`;
    
    // Resize chart secara otomatis agar pas setelah ukuran layar berubah
    setTimeout(() => {
        const chartContainer = document.getElementById('chart');
        chart.resize(chartContainer.clientWidth, 450);
    }, 250);
}

// ======================================
// CLOCK
// ======================================
setInterval(() => {
    document.getElementById('clock').innerHTML = new Date().toLocaleTimeString('id-ID');
}, 1000);

// ======================================
// BUTTONS GENERATOR
// ======================================
function createButtons() {
    const container = document.getElementById('pairButtons');
    container.innerHTML = '';

    Object.keys(assetMapping).forEach(pairKey => {
        const btn = document.createElement('button');
        btn.className = `px-5 py-2.5 rounded-xl font-bold border ${
            pairKey === state.pair 
            ? 'bg-emerald-500 text-white border-emerald-400 shadow-lg shadow-emerald-500/20' 
            : 'bg-slate-800 text-slate-300 border-slate-700'
        }`;
        btn.innerHTML = pairKey === 'XAUUSD' ? '🥇 XAU/USD (GOLD)' : '🔷 ETHEREUM';
        btn.onclick = () => {
            state.pair = pairKey;
            document.getElementById('pairText').innerHTML = pairKey;
            resetData();
            createButtons();
            connectWS();
        };
        container.appendChild(btn);
    });
}

// ======================================
// RESET
// ======================================
function resetData() {
    state.prices = [];
    state.candles = [];
    state.currentCandle = null;
    state.vwapPV = 0;
    state.vwapVolume = 0;
    
    if (candleSeries) candleSeries.setData([]);
    if (emaSeries) emaSeries.setData([]);
}

// ======================================
// CHART INITIALIZATION
// ======================================
const chart = LightweightCharts.createChart(
    document.getElementById('chart'),
    {
        layout: { background: { color: '#081018' }, textColor: '#cbd5e1' },
        grid: { vertLines: { color: '#0f172a' }, horzLines: { color: '#0f172a' } },
        rightPriceScale: { borderColor: '#1e293b' },
        timeScale: { borderColor: '#1e293b' }
    }
);

const candleSeries = chart.addCandlestickSeries();
const emaSeries = chart.addLineSeries({ lineWidth: 2, color: '#38bdf8' });

// Pantau ukuran layar jika user mengubah ukuran browser manual
window.addEventListener('resize', () => {
    const chartContainer = document.getElementById('chart');
    chart.resize(chartContainer.clientWidth, 450);
});

// ======================================
// CONNECT WEBSOCKET (Hybrid Spot & Futures)
// ======================================
function connectWS() {
    if (state.ws) state.ws.close();

    const activeAsset = assetMapping[state.pair];
    let wsUrl = '';

    // Seleksi Endpoint WebSocket berdasarkan tipe Aset (Spot vs Futures)
    if (activeAsset.type === 'futures') {
        wsUrl = `wss://fstream.binance.com/ws/${activeAsset.symbol}@trade`;
    } else {
        wsUrl = `wss://stream.binance.com:9443/ws/${activeAsset.symbol}@trade`;
    }

    state.ws = new WebSocket(wsUrl);

    state.ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const price = parseFloat(data.p);
        const volume = parseFloat(data.q);

        updatePrice(price);
        buildCandle(price, volume);
    };
}

// ======================================
// UPDATE PRICE
// ======================================
function updatePrice(price) {
    const el = document.getElementById('priceText');
    if (price > state.lastPrice) {
        el.className = 'text-5xl font-black buy';
    } else if (price < state.lastPrice) {
        el.className = 'text-5xl font-black sell';
    }
    
    el.innerHTML = price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    state.lastPrice = price;
    state.prices.push(price);

    if (state.prices.length > 200) state.prices.shift();
}

// ======================================
// BUILD CANDLE
// ======================================
function buildCandle(price, volume) {
    const time = Math.floor(Date.now() / 60000) * 60;

    if (!state.currentCandle) {
        state.currentCandle = { time, open: price, high: price, low: price, close: price };
        return;
    }

    if (state.currentCandle.time !== time) {
        state.candles.push(state.currentCandle);
        if (state.candles.length > 200) state.candles.shift();

        state.currentCandle = { time, open: price, high: price, low: price, close: price };
    } else {
        state.currentCandle.high = Math.max(state.currentCandle.high, price);
        state.currentCandle.low = Math.min(state.currentCandle.low, price);
        state.currentCandle.close = price;
    }

    state.vwapPV += price * volume;
    state.vwapVolume += volume;

    updateChart();
    generateSignal();
}

// ======================================
// UPDATE CHART
// ======================================
function updateChart() {
    if (!state.currentCandle) return;

    candleSeries.update(state.currentCandle);

    const closes = state.candles.map(c => c.close);
    closes.push(state.currentCandle.close);

    const ema = EMA(20, closes);
    emaSeries.update({ time: state.currentCandle.time, value: ema });
}

// ======================================
// INDICATORS: EMA & RSI
// ======================================
function EMA(period, data) {
    if (data.length < period) return data[data.length - 1] || 0;
    const k = 2 / (period + 1);
    let ema = data[0];
    for (let i = 1; i < data.length; i++) {
        ema = data[i] * k + ema * (1 - k);
    }
    return ema;
}

function RSI() {
    if (state.candles.length < 15) return 50;

    let gains = 0;
    let losses = 0;
    const startIndex = state.candles.length - 14;

    for (let i = startIndex; i < state.candles.length; i++) {
        const diff = state.candles[i].close - state.candles[i - 1].close;
        if (diff > 0) {
            gains += diff;
        } else {
            losses += Math.abs(diff);
        }
    }

    const avgGain = gains / 14;
    const avgLoss = losses / 14;

    if (avgLoss === 0) return 100;
    const rs = avgGain / avgLoss;
    return 100 - (100 / (1 + rs));
}

// ======================================
// SIGNAL GENERATOR
// ======================================
function generateSignal() {
    if (state.candles.length < 20) {
        document.getElementById('statusText').innerHTML = `Mengumpulkan data pasar (${state.candles.length}/20 mnt)...`;
        return;
    }

    const closes = state.candles.map(c => c.close);
    const current = state.currentCandle.close;
    const ema = EMA(20, closes);
    const rsi = RSI();
    const vwap = state.vwapPV / (state.vwapVolume || 1);

    let signal = 'WAIT';
    let score = 50;
    let reason = 'Market sideways / No confirmation';

    if (current > ema && rsi > 55) {
        signal = 'BUY';
        score = Math.min(95, Math.floor(50 + (rsi - 50) * 2));
        reason = 'Bullish Confirmed (Price > EMA20 + RSI Momentum)';
    } else if (current < ema && rsi < 45) {
        signal = 'SELL';
        score = Math.min(95, Math.floor(50 + (50 - rsi) * 2));
        reason = 'Bearish Confirmed (Price < EMA20 + RSI Breakdown)';
    }

    updateUI(signal, score, reason, rsi, vwap, current);
}

// ======================================
// UPDATE UI
// ======================================
function updateUI(signal, score, reason, rsi, vwap, current) {
    const signalText = document.getElementById('signalText');
    const badge = document.getElementById('signalBadge');

    signalText.innerHTML = signal;
    badge.innerHTML = signal;

    if (signal === 'BUY') {
        signalText.className = 'text-6xl font-black buy mb-3';
        badge.className = 'px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 text-xs font-bold';
        document.getElementById('trendText').innerHTML = 'BULLISH';
        document.getElementById('trendText').className = 'text-2xl font-black text-emerald-400';
    } else if (signal === 'SELL') {
        signalText.className = 'text-6xl font-black sell mb-3';
        badge.className = 'px-3 py-1 rounded-full bg-red-500/20 text-red-400 text-xs font-bold';
        document.getElementById('trendText').innerHTML = 'BEARISH';
        document.getElementById('trendText').className = 'text-2xl font-black text-red-400';
    } else {
        signalText.className = 'text-6xl font-black wait mb-3';
        badge.className = 'px-3 py-1 rounded-full bg-slate-700 text-xs font-bold';
        document.getElementById('trendText').innerHTML = 'SIDEWAYS';
        document.getElementById('trendText').className = 'text-2xl font-black text-slate-400';
    }

    document.getElementById('reasonText').innerHTML = reason;
    document.getElementById('rsiText').innerHTML = rsi.toFixed(1);
    document.getElementById('vwapText').innerHTML = vwap.toLocaleString('en-US', { maximumFractionDigits: 2 });
    document.getElementById('scoreText').innerHTML = score + '%';
    
    document.getElementById('slText').innerHTML = (current * 0.995).toLocaleString('en-US', { minimumFractionDigits: 2 });
    document.getElementById('tpText').innerHTML = (current * 1.01).toLocaleString('en-US', { minimumFractionDigits: 2 });

    document.getElementById('statusText').innerHTML = `EMA(20) ACTIVE • RSI(14) MATURED • VWAP REALTIME`;
}

// ======================================
// INIT RUN
// ======================================
createButtons();
connectWS();

</script>
</body>
</html>
